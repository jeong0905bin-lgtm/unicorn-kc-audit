name: Coupang indexed detail reader probe

on:
  push:
    branches: [chatgpt/run-unicorn-audit-20260730]
    paths:
      - "run/index-reader-probe.trigger"
      - "tools/coupang_index_reader_probe.py"
      - ".github/workflows/coupang-index-reader-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - "run/index-reader-probe.trigger"
      - "tools/coupang_index_reader_probe.py"
      - ".github/workflows/coupang-index-reader-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Validate source
        run: python -m py_compile tools/coupang_index_reader_probe.py
      - name: Probe indexed and reader routes
        run: python tools/coupang_index_reader_probe.py --output diagnostics/index-reader/result.json
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-index-reader-probe
          path: diagnostics/index-reader
          if-no-files-found: error
          retention-days: 7
