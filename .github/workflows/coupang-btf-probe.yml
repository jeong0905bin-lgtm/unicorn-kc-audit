name: Coupang BTF JSON probe

on:
  push:
    branches: [chatgpt/run-unicorn-audit-20260730]
    paths:
      - "run/btf-probe.trigger"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu24
          - os: windows-2025
            label: windows25
          - os: macos-15
            label: macos15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependency
        run: pip install requests
      - name: Validate source
        run: python -m py_compile tools/coupang_btf_probe.py
      - name: Probe lightweight BTF JSON
        env:
          RUNNER_LABEL: ${{ matrix.label }}
          PROBE_OUTPUT: diagnostics/btf/${{ matrix.label }}/result.json
        run: python tools/coupang_btf_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupang-btf-probe-${{ matrix.label }}
          path: diagnostics/btf/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
