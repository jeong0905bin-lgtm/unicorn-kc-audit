name: Sunsu Commerce Coupang-Only Final Validation

on:
  push:
    branches: [chatgpt/sunsu-commerce-audit]
    paths: [".github/workflows/sunsu-commerce-audit.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/sunsu-commerce-audit.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: 31100791607

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install openpyxl
      - uses: actions/download-artifact@v4
        with:
          pattern: sunsu-coupang-only-*
          path: sellers/sunsu-commerce/diagnostics/coupang-only-download
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate only successful Coupang page evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import Workbook
          from openpyxl.styles import PatternFill, Font, Alignment
          root=Path('sellers/sunsu-commerce/diagnostics')
          rows=[]
          for f in sorted((root/'coupang-only-download').rglob('result-*.json')):
              rows.extend(json.loads(f.read_text(encoding='utf-8')).get('products',[]))
          uniq={}
          for r in rows:
              key=(str(r.get('productId','')),str(r.get('itemId','')),str(r.get('vendorItemId','')))
              uniq[key]=r
          rows=list(uniq.values())
          for r in rows:
              valid=[]
              reached=False
              for ev in r.get('coupangEvidence') or []:
                  http=int(ev.get('http') or 0)
                  if ev.get('blocked') or http in (403,429) or not (200 <= http < 400):
                      continue
                  reached=True
                  for n in ev.get('kcNumbers') or []:
                      n=str(n).strip().upper()
                      if n and n not in ('REFERENCE','ACCESS','DENIED') and n not in valid:
                          valid.append(n)
              r['coupangPageReached']=reached
              r['coupangKcNumbers']=valid
              r['coupangKcNumber']=valid[0] if valid else ''
              r['coupangKcStatus']='표기됨' if valid else ('없음' if reached else '조회실패')
          summary={
            'auditedListings':len(rows),
            'pageReached':sum(bool(r.get('coupangPageReached')) for r in rows),
            'kcShown':sum(bool(r.get('coupangKcNumber')) for r in rows),
            'kcAbsent':sum(r.get('coupangKcStatus')=='없음' for r in rows),
            'lookupFailed':sum(r.get('coupangKcStatus')=='조회실패' for r in rows),
          }
          root.mkdir(parents=True,exist_ok=True)
          (root/'coupang-only-results.json').write_text(json.dumps({'summary':summary,'products':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'coupang-only-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          wb=Workbook(); ws=wb.active; ws.title='쿠팡상세 기준'
          ws.append(['제품명','판매자명','쿠팡고유번호','KC번호'])
          for r in sorted(rows,key=lambda x:str(x.get('productName',''))):
              cid=f"{r.get('productId','')} - {r.get('itemId','')}".strip(' -')
              kc=r.get('coupangKcNumber') or ('없음' if r.get('coupangKcStatus')=='없음' else '조회실패')
              ws.append([r.get('productName',''),'순수커머스',cid,kc])
          fill=PatternFill('solid',fgColor='17365D')
          for c in ws[1]:
              c.fill=fill; c.font=Font(color='FFFFFF',bold=True); c.alignment=Alignment(horizontal='center')
          ws.column_dimensions['A'].width=52; ws.column_dimensions['B'].width=16
          ws.column_dimensions['C'].width=24; ws.column_dimensions['D'].width=22
          for row in ws.iter_rows(min_row=2):
              for c in row[1:]: c.alignment=Alignment(horizontal='center')
          out=Path('sellers/sunsu-commerce/outputs/순수커머스_쿠팡상세_KC최종_검증.xlsx')
          out.parent.mkdir(parents=True,exist_ok=True); wb.save(out)
          print(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sunsu-coupang-only-validated-final
          path: |
            sellers/sunsu-commerce/diagnostics/coupang-only-results.json
            sellers/sunsu-commerce/diagnostics/coupang-only-summary.json
            sellers/sunsu-commerce/outputs/순수커머스_쿠팡상세_KC최종_검증.xlsx
