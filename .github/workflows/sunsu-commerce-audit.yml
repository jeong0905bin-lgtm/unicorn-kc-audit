name: Sunsu Commerce Unicorn KC Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sellers/sunsu-commerce/**'
      - '.github/workflows/sunsu-commerce-audit.yml'

permissions:
  contents: write

env:
  SELLER_ROOT: sellers/sunsu-commerce

jobs:
  stage1:
    name: stage 1 - enumerate all 195 and confirm Unicorn publisher
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sellers/sunsu-commerce/requirements.txt
      - run: pip install -r "$SELLER_ROOT/requirements.txt"
      - name: Enumerate complete seller catalog and classify publisher
        run: |
          python "$SELLER_ROOT/src/stage1_enumerate_unicorn.py" \
            --out "$SELLER_ROOT/diagnostics/stage1-all-products.json" \
            --confirmed-out "$SELLER_ROOT/diagnostics/publisher-confirmed-stage1.json"
      - name: Validate stage 1 completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sellers/sunsu-commerce/diagnostics/stage1-all-products.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['summary']['discoveredUniqueProductIds']==195, d['summary']
          assert d['summary']['catalogComplete'] is True, d['summary']
          ids=[x['productId'] for x in d['products']]
          assert len(ids)==len(set(ids))==195
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sunsu-stage1
          path: |
            sellers/sunsu-commerce/diagnostics/stage1-all-products.json
            sellers/sunsu-commerce/diagnostics/publisher-confirmed-stage1.json
          if-no-files-found: error
          retention-days: 30

  stages2to4:
    name: stages 2-4 - KC detail, remembered lookup, Excel
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sellers/sunsu-commerce/requirements.txt
      - run: pip install -r "$SELLER_ROOT/requirements.txt"
      - uses: actions/download-artifact@v4
        with:
          name: sunsu-stage1
          path: sellers/sunsu-commerce/diagnostics
      - name: Run stages 2, 3, and 4 only after stage 1 passes
        run: |
          python "$SELLER_ROOT/src/staged_pipeline.py" \
            --stage1-input "$SELLER_ROOT/diagnostics/stage1-all-products.json" \
            --root "$SELLER_ROOT" \
            --remembered-evidence "$SELLER_ROOT/diagnostics/safetykorea-status.json"
      - name: Validate final output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('sellers/sunsu-commerce')
          s1=json.loads((root/'diagnostics/stage1-all-products.json').read_text(encoding='utf-8'))
          assert s1['summary']['discoveredUniqueProductIds']==195
          summary=json.loads((root/'diagnostics/final-summary.json').read_text(encoding='utf-8'))['summary']
          assert summary['중복 수']==0, summary
          confirmed=json.loads((root/'diagnostics/publisher-confirmed.json').read_text(encoding='utf-8'))
          assert all(x.get('kcNumber')!='U003E1577-7011' for x in confirmed)
          out=root/'outputs/순수커머스_전체유니콘상품_KC최종.xlsx'
          assert out.exists() and out.stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 순수커머스-전체유니콘상품-KC최종
          path: |
            sellers/sunsu-commerce/outputs/순수커머스_전체유니콘상품_KC최종.xlsx
            sellers/sunsu-commerce/diagnostics/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified diagnostics and workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sellers/sunsu-commerce/diagnostics sellers/sunsu-commerce/outputs
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Sunsu Commerce audit outputs [skip ci]'
            git push
          fi
