name: Sunsu Commerce Audit

on:
  push:
    branches:
      - main
      - chatgpt/sunsu-commerce-audit
    paths:
      - "sellers/sunsu-commerce/**"
      - ".github/workflows/sunsu-commerce-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SELLER_ROOT: sellers/sunsu-commerce

jobs:
  stage1:
    name: stage 1 - collect 195 products and publisher candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r "$SELLER_ROOT/requirements.txt"
      - name: Collect seller products
        run: |
          python "$SELLER_ROOT/src/stage1_enumerate_unicorn.py" \
            --out "$SELLER_ROOT/diagnostics/seller-products.json" \
            --confirmed-out "$SELLER_ROOT/diagnostics/publisher-candidates.json"
      - name: Validate stage 1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('sellers/sunsu-commerce/diagnostics')
          data=json.loads((root/'seller-products.json').read_text(encoding='utf-8'))
          products=data.get('products', data if isinstance(data,list) else [])
          ids=[str(x.get('productId','')) for x in products if x.get('productId')]
          print({'productIdCount':len(set(ids)),'rowCount':len(products)})
          assert len(set(ids))==195, f'expected 195 unique productIds, got {len(set(ids))}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunsu-stage1
          path: |
            sellers/sunsu-commerce/diagnostics/seller-products.json
            sellers/sunsu-commerce/diagnostics/publisher-candidates.json
          if-no-files-found: warn

  stage2:
    name: stage 2 - find KC numbers for confirmed products
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r "$SELLER_ROOT/requirements.txt"
      - uses: actions/download-artifact@v4
        with:
          name: sunsu-stage1
          path: sellers/sunsu-commerce/diagnostics
      - name: Run KC detail collection
        run: |
          python "$SELLER_ROOT/src/staged_pipeline.py" \
            --stage1-input "$SELLER_ROOT/diagnostics/seller-products.json" \
            --root "$SELLER_ROOT" \
            --remembered-evidence "$SELLER_ROOT/diagnostics/safetykorea-status.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunsu-stage2
          path: sellers/sunsu-commerce/diagnostics/*.json
          if-no-files-found: warn
