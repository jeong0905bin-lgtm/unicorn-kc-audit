name: Sunsu Commerce Fast KC

on:
  push:
    branches: [chatgpt/sunsu-commerce-audit]
    paths:
      - ".github/workflows/sunsu-commerce-audit.yml"
      - "sellers/sunsu-commerce/src/browser_kc_audit_shard.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sunsu-commerce-audit.yml"
      - "sellers/sunsu-commerce/src/browser_kc_audit_shard.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SELLER_ROOT: sellers/sunsu-commerce
  CANDIDATE_RUN_ID: 31018852316

jobs:
  fast-kc-candidates:
    name: validate 3 KC candidates now
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r "$SELLER_ROOT/requirements.txt"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Download prior candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: sunsu-browser-kc-final
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sellers/sunsu-commerce/raw/candidate-source
      - name: Extract only candidate listings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=next(Path('sellers/sunsu-commerce/raw/candidate-source').rglob('browser-kc-results.json'))
          data=json.loads(src.read_text(encoding='utf-8'))
          rows=[r for r in data.get('products',[]) if r.get('kcCandidates')]
          out=Path('sellers/sunsu-commerce/raw/kc-candidates.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'shard':'candidate-only','products':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print({'candidateListings':len(rows),'candidateNumbers':sorted({c for r in rows for c in r.get('kcCandidates',[])})})
          PY
      - name: Validate candidates only
        run: |
          mkdir -p "$SELLER_ROOT/diagnostics"
          python "$SELLER_ROOT/src/browser_kc_audit_shard.py" \
            --input "$SELLER_ROOT/raw/kc-candidates.json" \
            --out "$SELLER_ROOT/diagnostics/fast-kc-candidates.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sunsu-fast-kc-candidates
          path: |
            sellers/sunsu-commerce/raw/kc-candidates.json
            sellers/sunsu-commerce/diagnostics/fast-kc-candidates.json
