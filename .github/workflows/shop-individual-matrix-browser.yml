name: Shop individualInfo browser matrix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "run/shop-individual-matrix.trigger"
      - "tools/shop_individual_matrix_browser_v2.py"
      - ".github/workflows/shop-individual-matrix-browser.yml"
  push:
    branches: [chatgpt/run-unicorn-audit-20260730]
    paths:
      - "run/shop-individual-matrix.trigger"
      - "tools/shop_individual_matrix_browser_v2.py"
      - ".github/workflows/shop-individual-matrix-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/run-unicorn-audit-20260730
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate matrix
        run: python -m py_compile tools/shop_individual_matrix_browser_v2.py
      - name: Run individualInfo request matrix
        run: python tools/shop_individual_matrix_browser_v2.py --output diagnostics/shop-individual-matrix/result.json
      - name: Commit sanitized matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/shop-individual-matrix/result.json
          git diff --cached --quiet || git commit -m "Record shop individualInfo browser matrix"
          git pull --rebase origin chatgpt/run-unicorn-audit-20260730
          git push origin HEAD:chatgpt/run-unicorn-audit-20260730
