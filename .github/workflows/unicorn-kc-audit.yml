name: Unicorn KC audit

on:
  push:
    branches: [chatgpt/run-unicorn-audit-20260730]
    paths:
      - "run/unicorn-audit.trigger"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: unicorn-kc-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Block execution until validated engine is installed
        run: |
          echo "The previous engine is intentionally disabled."
          echo "Run the access matrix probe and install the validated engine before creating run/unicorn-audit.trigger."
          exit 1
